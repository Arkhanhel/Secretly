# Внешний слой: TLS с сертификатом волонтёра на 443. Внутри — байты второго
# TLS-соединения клиента с настоящим сервером; они передаются nginx-relay.
# Замените secretly-proxy.example.org на свой домен (init-certificate.sh
# делает это сам).
user nginx;
worker_processes auto;
error_log /dev/null;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    # Журнал выключен намеренно: прокси не должен знать, кто им пользуется.
    access_log off;

    server {
        listen 443 ssl;
        ssl_certificate     /etc/letsencrypt/live/secretly-proxy.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/secretly-proxy.example.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        proxy_pass nginx-relay:4433;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
