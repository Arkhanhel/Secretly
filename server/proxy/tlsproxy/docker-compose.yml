# Secretly TLS proxy for volunteers (Э1 «Мессенджер без центра», 11.10.2026).
#
# Устройство как у Signal-TLS-Proxy: внешний nginx снимает TLS с сертификатом
# волонтёра, внутри остаётся второй TLS-поток, который клиент установил с
# настоящим сервером; второй nginx читает SNI этого потока и передаёт байты
# дальше без расшифровки. Волонтёр не видит содержимого и не может его
# подменить: внутренний TLS проверяет сертификат настоящего сервера.
#
# Запуск: см. README.md (нужны домен, порт 443 и Let's Encrypt).
services:
  nginx-terminate:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx-terminate/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - nginx-relay
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  nginx-relay:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx-relay/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "4433"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
