# Внутренний слой: читает SNI второго TLS-потока и передаёт его на настоящий
# сервер Secretly как есть. Любое другое имя — обрыв: прокси не открытый
# ретранслятор.
user nginx;
worker_processes auto;
error_log /dev/null;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    access_log off;

    map $ssl_preread_server_name $secretly_upstream {
        keys.secretlyapp.com  keys.secretlyapp.com:443;
        relay.secretlyapp.com relay.secretlyapp.com:443;
        default               "";
    }

    server {
        listen 4433;
        ssl_preread on;
        proxy_pass $secretly_upstream;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
